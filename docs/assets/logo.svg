<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1124" />
      <stop offset="50%" stop-color="#070a14" />
      <stop offset="100%" stop-color="#04060b" />
    </linearGradient>

    <!-- Glowing Core Gradient -->
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="purplePink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b176fc" />
      <stop offset="100%" stop-color="#e056fd" />
    </linearGradient>

    <linearGradient id="goldAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6d365" />
      <stop offset="100%" stop-color="#fda085" />
    </linearGradient>

    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#4facfe" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#7000ff" stop-opacity="0.8" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Hexagonal Shield Container -->
  <path d="M 256,24 L 464,136 L 464,376 L 256,488 L 48,376 L 48,136 Z" 
        fill="url(#bgGrad)" 
        stroke="url(#shieldBorder)" 
        stroke-width="5" 
        stroke-linejoin="round" />

  <!-- Inner Cyber Hexagon Grid Accent -->
  <path d="M 256,44 L 444,146 L 444,366 L 256,468 L 68,366 L 68,146 Z" 
        fill="none" 
        stroke="#1e293b" 
        stroke-width="1.5" 
        stroke-dasharray="8 6" />

  <!-- Symplectic Phase-Space Orbits (p^2 + q^2 = 2H) -->
  <ellipse cx="256" cy="256" rx="175" ry="70" 
           fill="none" 
           stroke="url(#cyanBlue)" 
           stroke-width="3" 
           stroke-opacity="0.75" 
           transform="rotate(-28 256 256)" 
           filter="url(#softGlow)" />

  <ellipse cx="256" cy="256" rx="175" ry="70" 
           fill="none" 
           stroke="url(#purplePink)" 
           stroke-width="2" 
           stroke-opacity="0.6" 
           stroke-dasharray="6 8"
           transform="rotate(32 256 256)" />

  <!-- Bond Graph Multi-Physics Junction Connections (Dirac Structure Network) -->
  <!-- Bond 1: Mechanical (Top-Left) -->
  <line x1="256" y1="256" x2="140" y2="150" stroke="#00f2fe" stroke-width="4" stroke-linecap="round" filter="url(#softGlow)" />
  <!-- Half-arrowhead for Bond 1 -->
  <path d="M 190,195 L 182,180 L 198,188 Z" fill="#00f2fe" />

  <!-- Bond 2: Electrical (Top-Right) -->
  <line x1="256" y1="256" x2="372" y2="150" stroke="#fda085" stroke-width="4" stroke-linecap="round" filter="url(#softGlow)" />
  <!-- Half-arrowhead for Bond 2 -->
  <path d="M 322,195 L 330,180 L 314,188 Z" fill="#fda085" />

  <!-- Bond 3: Thermal / Hydraulic (Bottom-Center) -->
  <line x1="256" y1="256" x2="256" y2="390" stroke="#e056fd" stroke-width="4" stroke-linecap="round" filter="url(#softGlow)" />
  <!-- Half-arrowhead for Bond 3 -->
  <path d="M 256,325 L 268,312 L 256,335 Z" fill="#e056fd" />

  <!-- Physical Domain Junction Nodes -->
  <!-- Node M: Mechanical (Junction 1) -->
  <circle cx="140" cy="150" r="28" fill="#0c162d" stroke="#00f2fe" stroke-width="3.5" filter="url(#softGlow)" />
  <text x="140" y="157" fill="#00f2fe" font-family="monospace, sans-serif" font-weight="900" font-size="20" text-anchor="middle">1_m</text>

  <!-- Node E: Electrical (Junction 0) -->
  <circle cx="372" cy="150" r="28" fill="#1f140e" stroke="#fda085" stroke-width="3.5" filter="url(#softGlow)" />
  <text x="372" y="157" fill="#fda085" font-family="monospace, sans-serif" font-weight="900" font-size="20" text-anchor="middle">0_e</text>

  <!-- Node T: Thermal / Fluidic -->
  <circle cx="256" cy="390" r="28" fill="#1b0e24" stroke="#e056fd" stroke-width="3.5" filter="url(#softGlow)" />
  <text x="256" y="397" fill="#e056fd" font-family="monospace, sans-serif" font-weight="900" font-size="20" text-anchor="middle">1_th</text>

  <!-- Central Dirac Port-Hamiltonian Engine Core -->
  <circle cx="256" cy="256" r="46" fill="#090e1a" stroke="url(#cyanBlue)" stroke-width="4" filter="url(#neonGlow)" />

  <!-- Symplectic Omega (Ω) & Hamiltonian Symbol Nexus -->
  <path d="M 230,280 L 244,280 C 242,260 234,248 240,236 C 245,226 256,224 256,224 C 256,224 267,226 272,236 C 278,248 270,260 268,280 L 282,280" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="6" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#softGlow)" />
  
  <!-- Pulse Core Center -->
  <circle cx="256" cy="256" r="6" fill="#00f2fe" filter="url(#neonGlow)" />
</svg>

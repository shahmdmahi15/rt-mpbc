<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <radialGradient id="ogGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#0e3a66" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#04060b" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="ogCyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#7000ff" />
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#060911" />
  <rect width="1200" height="630" fill="url(#ogGlow)" />

  <!-- Background Tech Grid Lines -->
  <g stroke="#131e33" stroke-width="1" stroke-dasharray="8 8">
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Giant Logo Emblem (Center-Right) -->
  <g transform="translate(680, 75) scale(0.95)">
    <path d="M 256,24 L 464,136 L 464,376 L 256,488 L 48,376 L 48,136 Z" 
          fill="#081020" 
          stroke="url(#shieldBorder)" 
          stroke-width="7" 
          stroke-linejoin="round" />
    <ellipse cx="256" cy="256" rx="175" ry="70" fill="none" stroke="#00f2fe" stroke-width="4" stroke-opacity="0.8" transform="rotate(-28 256 256)" filter="url(#neon)" />
    <line x1="256" y1="256" x2="140" y2="150" stroke="#00f2fe" stroke-width="5" stroke-linecap="round" />
    <line x1="256" y1="256" x2="372" y2="150" stroke="#fda085" stroke-width="5" stroke-linecap="round" />
    <line x1="256" y1="256" x2="256" y2="390" stroke="#e056fd" stroke-width="5" stroke-linecap="round" />
    <circle cx="140" cy="150" r="30" fill="#0c162d" stroke="#00f2fe" stroke-width="4" />
    <text x="140" y="159" fill="#00f2fe" font-family="monospace, sans-serif" font-weight="900" font-size="22" text-anchor="middle">1_m</text>
    <circle cx="372" cy="150" r="30" fill="#1f140e" stroke="#fda085" stroke-width="4" />
    <text x="372" y="159" fill="#fda085" font-family="monospace, sans-serif" font-weight="900" font-size="22" text-anchor="middle">0_e</text>
    <circle cx="256" cy="390" r="30" fill="#1b0e24" stroke="#e056fd" stroke-width="4" />
    <text x="256" y="399" fill="#e056fd" font-family="monospace, sans-serif" font-weight="900" font-size="22" text-anchor="middle">1_th</text>
    <circle cx="256" cy="256" r="48" fill="#090e1a" stroke="url(#ogCyanBlue)" stroke-width="5" filter="url(#neon)" />
    <path d="M 226,282 L 242,282 C 240,260 232,246 238,234 C 244,222 256,220 256,220 C 256,220 268,222 274,234 C 280,246 272,260 270,282 L 286,282" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="256" cy="256" r="7" fill="#00f2fe" />
  </g>

  <!-- Left Content Block -->
  <g transform="translate(100, 110)">
    <!-- Category Pill -->
    <rect x="0" y="0" width="280" height="36" rx="18" fill="#0c233c" stroke="#00f2fe" stroke-width="1.5" />
    <text x="140" y="24" fill="#00f2fe" font-family="monospace, sans-serif" font-weight="800" font-size="14" text-anchor="middle">HARD REAL-TIME SYSTEM</text>

    <!-- Headline -->
    <text x="0" y="110" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="76" fill="#ffffff" letter-spacing="-2">
      RT-MPBC
    </text>

    <!-- Subtitle -->
    <text x="0" y="165" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="28" fill="url(#ogCyanBlue)">
      Multi-Physics Bond-Graph Compiler
    </text>
    <text x="0" y="205" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="22" fill="#94a3b8">
      &amp; Symplectic Geometric Solver
    </text>

    <!-- Bullet Highlights -->
    <g transform="translate(0, 255)" font-family="monospace, sans-serif" font-size="16" fill="#cbd5e1">
      <text x="0" y="0">⚡ 26 Nanosecond Execution Latency</text>
      <text x="0" y="32">🛡️ Strict First-Law Symplectic Preservation</text>
      <text x="0" y="64">🚫 Zero Heap Allocation (malloc-free)</text>
      <text x="0" y="96">📦 Python (PyPI) • Rust (#![no_std]) • C99 (MISRA)</text>
    </g>

    <!-- Footer URL -->
    <text x="0" y="440" font-family="monospace, sans-serif" font-weight="700" font-size="19" fill="#00f2fe">
      https://rt-mpbc.shahmdmahi.dpdns.org
    </text>
  </g>
</svg>
